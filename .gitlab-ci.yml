stages:
  - check
  - release

default:
  image: alpine:3.20
  before_script:
    - apk add --no-cache git curl python3 >/dev/null

# ---------------------------------------------------------------
# Runs in merge requests and on pushes to main. The release stage
# waits for this one, so a failure here means no new version.
# ---------------------------------------------------------------
check:
  stage: check
  image: serversideup/php:8.4-cli
  before_script: []
  script:
    - composer validate --strict --no-check-publish
    - composer install --no-interaction --no-progress --prefer-dist
    # php -l does not catch undefined variables - this does
    - php scripts/undefined-variables.php src
    - vendor/bin/phpunit --no-coverage
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        apk add --no-cache python3 >/dev/null 2>&1 || true
        python3 scripts/release.py --check
      fi
  cache:
    key:
      files:
        - composer.json
    paths:
      - .composer-cache/
  variables:
    COMPOSER_CACHE_DIR: .composer-cache
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE !~ /^chore\(release\)/

# ---------------------------------------------------------------
# Runs after a push to main: derives the bump from the CHANGELOG,
# writes it forward, tags, and publishes to the Composer registry.
# ---------------------------------------------------------------
release:
  stage: release
  script:
    - git config user.email "ci@bremalu.de"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch --tags --quiet
    - |
      set -e
      python3 scripts/release.py > release.env || rc=$?
      if [ "${rc:-0}" = "78" ]; then
        echo "No [Unreleased] entry in the CHANGELOG - nothing to release."
        exit 0
      fi
      . ./release.env
      echo "New version: $NEW_VERSION (bump: $BUMP)"

      git add CHANGELOG.md
      git commit -m "chore(release): $NEW_VERSION [skip ci]"
      git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
      git push origin HEAD:$CI_DEFAULT_BRANCH
      git push origin "$NEW_VERSION"

      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data tag="$NEW_VERSION" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"
      echo ""
      echo "Published: $NEW_VERSION"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE !~ /^chore\(release\)/
