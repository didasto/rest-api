name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag, for example v1.0.0. Leave empty to derive it from the CHANGELOG.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest

    # A release commit must not trigger the next release.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Nothing gets tagged that has not passed the checks.
      - name: Check for undefined variables
        run: php scripts/undefined-variables.php src

      - name: Run the test suite
        run: vendor/bin/phpunit --no-coverage

      - name: Determine the version
        id: version
        run: |
          set -e

          if [ -n "${{ inputs.version }}" ]; then
            echo "NEW_VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "BUMP=manual" >> "$GITHUB_OUTPUT"
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exit code 78 means the [Unreleased] section is empty.
          python3 scripts/release.py > release.env || rc=$?

          if [ "${rc:-0}" = "78" ]; then
            echo "No [Unreleased] entry in the CHANGELOG - nothing to release."
            echo "NEW_VERSION=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat release.env >> "$GITHUB_OUTPUT"
          echo "CHANGED=true" >> "$GITHUB_OUTPUT"

      - name: Write the CHANGELOG forward
        if: steps.version.outputs.NEW_VERSION != '' && steps.version.outputs.CHANGED == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.NEW_VERSION }}"
          git push origin HEAD:main

      - name: Extract the release notes
        if: steps.version.outputs.NEW_VERSION != ''
        run: |
          python3 - "${{ steps.version.outputs.NEW_VERSION }}" <<'PY' > release-notes.md
          import re, sys

          version = sys.argv[1].lstrip('v')
          text    = open('CHANGELOG.md', encoding='utf-8').read()

          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text, re.MULTILINE | re.DOTALL,
          )

          print((match.group(1) if match else '').strip() or 'See CHANGELOG.md.')
          PY

      - name: Create the tag and the release
        if: steps.version.outputs.NEW_VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.NEW_VERSION }}"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already exists - nothing to do."
            exit 0
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --target "$(git rev-parse HEAD)"

          echo "Released $VERSION (bump: ${{ steps.version.outputs.BUMP }})"
